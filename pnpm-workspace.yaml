# pnpm runs no dependency install script unless it is listed here. Each entry
# is a deliberate decision to let that package execute code at install time.
allowBuilds:
  # Vitest transforms TypeScript with esbuild, whose postinstall links the
  # platform-specific binary. Denied, esbuild resolves to a stub and every test
  # fails to *load* — which reads as a broken suite rather than a broken
  # install, and sends you looking in the wrong place.
  esbuild: true
  sharp: true
